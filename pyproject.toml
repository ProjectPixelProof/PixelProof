[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixelproof"
version = "0.1.0"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
description = "Verifier-guided discovery of executable visual question worlds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pillow>=10.4", "tqdm>=4.66"]

[project.optional-dependencies]
runner = ["harbor==0.1.44"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/question_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
