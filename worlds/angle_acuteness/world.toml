# Machine-readable metadata for this question world. Parsed by the meta layer
# (question_foundry.worlds.discover_worlds) with stdlib tomllib — no extra deps.

[world]
name = "angle_acuteness"
description = "Angle-acuteness world: does the VLM preserve and causally use a continuous ANGULAR margin (m = 90 - θ degrees) to decide whether a drawn angle is acute or obtuse?"
task = "angle-acuteness"
method_refs = ["7.2", "7.6", "7.7"]
splits = ["smoke", "sweep", "pilot"]
entrypoint = "worlds.angle_acuteness.generate"

[targets]
# Ground-truth keys written into ExampleRecord.targets by renderer.scene_targets.
continuous = "m"          # signed angular margin 90 - theta (degrees); + acute
secondary = "theta"       # interior angle (degrees)
categorical = "label"     # acute | right | obtuse
binary = "acute"          # acute = (m > 0), strict
bin = "margin_bin"
# Constrained-eval keys (filled by generate.py from prompts.correct_answer /
# candidates_for; consumed by the task-agnostic question_foundry.eval runner).
answer = "answer"         # ground-truth constrained answer for this record's prompt_family
candidates = "candidates" # answer set the eval runner scores via constrained logits

# Position in the five-axis task space (SSOT §7.2).
[axes]
decision_variable = "m (signed angular margin 90 - theta, DEGREES — not a distance)"
nuisances = ["heading", "ray_length_1", "ray_length_2", "vertex_position", "stroke"]
structural = "1 vertex + 2 rays (fixed arity, binary angular relation)"
query_axes = ["decision_type (angle predicate / selection)", "lexical (acute/smaller-than-right/sharp)", "polarity (obtuse)"]
verifiability = "closed-form gold sign(90 - theta); two-line-fit inverse oracle; degree margin; render-robust label with a ray-length lever"

# Gold-recheck / gallery driver config (SSOT §7.6). Read by scripts/gold_recheck.py
# and scripts/make_gallery.py so new worlds need no per-script edits.
[gold]
decision_attr = "signed_margin"   # Scene attribute prompts.correct_answer() keys off
margin_checks = [["m", "signed_margin"]]   # (targets key, Scene attribute) pairs recomputed and matched
margin_key = "m"       # targets key holding the continuous margin (gallery caption)
quarantine_bin = "right"   # MARGIN_BINS band quarantined per SSOT §21.6
gallery_pool_splits = ["sweep"]
boundary_observable = "the two rays meeting at the shared vertex; m=0 is the right-angle event (the rays form a square 90-degree corner, neither acute nor obtuse), directly visible in the image"   # SSOT §7.14 gate 3

[provenance]
source_repo = "VLMHarnessTest/VLMH15"
source_commit = "89abcd3ed473f4155431274b9133f72ba0f42319"
source_path = "harnesses/angle_acuteness"
role = "visible_seed"
