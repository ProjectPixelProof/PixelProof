id = "rq3_example"
status = "awaiting_operator_approval"
mode = "discovery"
protocol = "question-world@0.4.0"
strategy = "episodic-sequential@0.7.0"
seed_set = "baseline_three@0.2.0"
mechanism_memory = "known-mechanisms@0.1.0"
negative_memory = "rejected-mechanisms@0.1.0"
outcome_memory = "funnel-outcomes@0.1.0"

[agent]
adapter = "codex_oauth:CodexOAuth"
model = "gpt-5.6-sol"
reasoning_effort = "max"
output_format = "json"
cli_version = "0.151.0"
timeout_seconds_per_episode = 1200
provider_turn_policy = "single_turn"
continuation_delay_seconds = 0

[campaign]
wall_time_seconds = 129600
minimum_start_seconds = 300
verifier_reserve_seconds = 900
cost_reporting = "unavailable_subscription"
soft_cost_limit_usd = 100.0
episode_limit_policy = "repeat_until_agent_budget"
completion_policy = "consume_agent_time_budget"
agent_time_seconds = 21600
transient_error_policy = "retry_with_backoff"
retry_backoff_seconds = [15, 30, 60]
max_consecutive_provider_failures = 3
max_consecutive_empty_submissions = 3

[task]
min_candidates = 1
repair_turns = -1
candidate_limit_policy = "exactly_one_per_session"

[verification]
semantic_neighbor_limit = 5
semantic_duplicate_threshold = 0.68
oracle_stress_seeds = [101, 2027, 9929]
oracle_stress_scenes_per_seed = 24

[environment]
agent_network = "public"
verifier_network = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 20480
render_runtime = "latex-tikz@0.1.0"

[transition]
require_submission_valid = true
require_all_mechanical_gates = true
require_registry_distinct = true
require_semantic_review_ready = true
canonical_admission = "human-only"

[comparison]
experiment_id = "rq3_example"
orchestration_mode = "episodic_sequential"
question_status = "paper_section3_frontier_feedback"
budget_scope = "single_replicate_six_useful_agent_hours"
context_policy = "fresh_sessions_with_ten_frozen_cluster_distinct_hard_seed_programs"
protected_verification_cadence = "after_every_session"
provider_conversation_resume = false
provider_turn_policy = "single_turn"
completion_policy = "consume_agent_time_budget"
session_limit_policy = "repeat_until_agent_budget"
candidate_limit_policy = "exactly_one_per_session"
proposal_refresh_policy = "controller_reasoning_branch"
hypothesis_profile = "paper-difficulty@0.3.0:frontier_hard_a"

[feedback_bootstrap]
id = "starting_collection_a"
manifest = "inputs/starting_collections/a/manifest.json"
manifest_sha256 = "f85c668527c9ff4fa4c4cccb3ad4cea756aa31c8cc163e433a978fd54b0e7e74"

[feedback_policy]
id = "difficulty-feedback@0.9.0"
render_scenes = 10
render_seed = 82901
max_examples_per_candidate = 5
sampling_seed = 20270829
sampling_method = "balanced-dataset"
sample_unit = "unique_image"
hard_accuracy_threshold = 0.6
aggregation = "majority_evaluators_at_or_below_threshold"
max_evaluated_candidates = 60
max_total_cost_usd = 25.0
request_timeout_seconds = 300
evaluator_retry_backoff_seconds = [15, 30, 60]
incomplete_episode_policy = "quarantine_feedback_and_continue"
max_consecutive_incomplete_feedback = 3
fail_closed_on_incomplete = true
feedback_visibility = "reasoning_branch_predictions_outcomes_rationales_and_effort"
builder_image_access = "none"
builder_attempt_memory_limit = 10
builder_samples_per_attempt = 2
reasoning_targets = ["counterfactual_intervention", "state_transition", "geometric_transformation", "quantitative_relation", "topological_connectivity", "correspondence_binding"]
parent_selection = "best_same_reasoning_target_or_initial_profile"

[feedback_policy.provider]
base_url = "https://openrouter.ai/api/v1"
order = []
allow_fallbacks = true
data_collection = "deny"
zdr = false
sort = "none"

